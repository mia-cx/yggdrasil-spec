name: netbird

x-default: &default
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 100m
      max-file: "2"

services:
  # VM-local reverse proxy. :8080 is the plain HTTP backend for the cluster
  # Traefik (accepts HTTP/1.1 and h2c); :8443 terminates TLS directly for
  # diagnosis and K3s-independent access.
  traefik:
    <<: *default
    image: traefik:v3.7.13
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    volumes:
      - ./traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./dynamic.yaml:/etc/traefik/dynamic.yaml:ro
      - traefik_letsencrypt:/letsencrypt
    networks: [netbird]

  # Combined server: Management + Signal + Relay (+ embedded IdP at /oauth2).
  netbird-server:
    <<: *default
    image: netbirdio/netbird-server:0.79.0
    volumes:
      - netbird_data:/var/lib/netbird
      - ./config.yaml:/etc/netbird/config.yaml:ro
    command: ["--config", "/etc/netbird/config.yaml"]
    networks: [netbird]

  dashboard:
    <<: *default
    image: netbirdio/dashboard:v2.92.0
    env_file: ./dashboard.env
    networks: [netbird]

  # Olympus LAN routing peer. Host network so routed mesh traffic leaves via
  # the VM's LAN (masqueraded); kernel WireGuard. Setup key auto-group:
  # routers-olympus. Spent after the first enrollment; state lives in the volume.
  netbird-router:
    <<: *default
    image: netbirdio/netbird:0.79.0
    network_mode: host
    cap_add: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
    environment:
      - NB_SETUP_KEY=${NB_ROUTER_SETUP_KEY}
      - NB_MANAGEMENT_URL=https://netbird.mia.cx
      - NB_HOSTNAME=olympus-router
    volumes:
      - netbird_router:/var/lib/netbird

  # AdGuard Home sidecar for human mesh devices. The netbird-dns peer owns the
  # network namespace: AdGuard joins it, so mesh DNS traffic enters over
  # wt0 directly and never touches a host port. The NetBird resolver is parked
  # on 127.0.0.153:5053 so it does not fight AdGuard for :53. The admin UI
  # binds only the dns-bridge address 172.30.1.2 — the host publish reaches
  # it, the mesh interface does not.
  netbird-dns:
    <<: *default
    image: netbirdio/netbird:0.79.0
    cap_add: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
    environment:
      - NB_SETUP_KEY=${NB_DNS_SETUP_KEY}
      - NB_MANAGEMENT_URL=https://netbird.mia.cx
      - NB_HOSTNAME=olympus-dns
      - NB_DNS_RESOLVER_ADDRESS=127.0.0.153:5053
    volumes:
      - netbird_dns:/var/lib/netbird
    ports:
      - "10.0.1.4:3000:3000"
    networks:
      dns:
        ipv4_address: 172.30.1.2

  adguard:
    <<: *default
    image: adguard/adguardhome:v0.107.79
    network_mode: service:netbird-dns
    depends_on: [netbird-dns]
    # Refuse to start without the rendered config: AdGuard would otherwise
    # serve its unauthenticated setup wizard on the published admin port.
    # Overriding entrypoint clears the image Cmd, so command restates it.
    entrypoint:
      - /bin/sh
      - -c
      - 'test -s /opt/adguardhome/conf/AdGuardHome.yaml || { echo "adguard/conf/AdGuardHome.yaml missing: render it first (README)" >&2; exit 1; }; exec /opt/adguardhome/AdGuardHome "$$@"'
      - adguard
    command:
      - "--no-check-update"
      - "-c"
      - "/opt/adguardhome/conf/AdGuardHome.yaml"
      - "-w"
      - "/opt/adguardhome/work"
    volumes:
      - ./adguard/conf:/opt/adguardhome/conf
      - adguard_work:/opt/adguardhome/work

volumes:
  netbird_data:
  netbird_router:
  netbird_dns:
  adguard_work:
  traefik_letsencrypt:

networks:
  netbird:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
  dns:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.1.0/24
          gateway: 172.30.1.1
