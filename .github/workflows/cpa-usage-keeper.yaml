name: CPA Usage Keeper image
on:
  push:
    paths:
      - apps/cpa-usage-keeper/**
      - .github/workflows/cpa-usage-keeper.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: apps/cpa-usage-keeper
          platforms: linux/amd64
          push: true
          tags: ghcr.io/mia-cx/yggdrasil-cpa-usage-keeper:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
