name: CLIProxyAPI image
on:
  push:
    paths:
      - apps/cliproxyapi/**
      - .github/workflows/cliproxyapi.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: apps/cliproxyapi
          platforms: linux/amd64
          push: true
          tags: ghcr.io/mia-cx/yggdrasil-cliproxyapi:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
