apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tdarr
  namespace: media
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`tdarr.yggdrasil.mia.cx`)
      kind: Rule
      middlewares:
        - name: authentik
          namespace: kube-system
      services:
        - name: tdarr
          port: 8265
  tls: {}
