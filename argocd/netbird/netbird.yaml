apiVersion: v1
kind: Namespace
metadata:
  name: netbird
---
# Selector-less Service + EndpointSlice routing to the NetBird VM (10.0.1.4:8080)
apiVersion: v1
kind: Service
metadata:
  name: netbird
  namespace: netbird
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: netbird-external
  namespace: netbird
  labels:
    kubernetes.io/service-name: netbird
addressType: IPv4
endpoints:
  - addresses:
      - "10.0.1.4"
    conditions:
      ready: true
ports:
  - name: http
    port: 8080
    protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: netbird
  namespace: netbird
spec:
  entryPoints: [websecure]
  routes:
    # gRPC services on netbird-server 0.79.0 need h2c; WebSockets cannot ride
    # h2c, so /relay, /ws-proxy/, /api, /oauth2, and the dashboard use the
    # plain HTTP catch-all.
    - match: Host(`netbird.mia.cx`) && (PathPrefix(`/signalexchange.SignalExchange/`) || PathPrefix(`/management.ManagementService/`) || PathPrefix(`/management.ProxyService/`))
      kind: Rule
      services:
        - name: netbird
          port: 8080
          scheme: h2c
    - match: Host(`netbird.mia.cx`)
      kind: Rule
      services:
        - name: netbird
          port: 8080
  tls: {}
