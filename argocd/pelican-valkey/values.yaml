## Valkey (Redis-compatible) for Pelican Panel
## Chart: valkey/valkey (official, BSD)
## Repo: https://valkey.io/valkey-helm/

fullnameOverride: pelican-valkey

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: workloads/games
              operator: Exists

dataStorage:
  enabled: true
  requestedSize: 1Gi
  className: longhorn
