## Valkey (Redis-compatible) for Pelican Panel
## Chart: valkey/valkey (official, BSD)
## Repo: https://valkey.io/valkey-helm/

fullnameOverride: pelican-valkey

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: workloads/games
              operator: Exists

persistence:
  enabled: true
  size: 1Gi
  storageClass: longhorn
