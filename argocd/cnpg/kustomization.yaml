## CloudNativePG operator: the upstream release manifest at the running version.
## Bump by changing the tag; an operator upgrade rolls every database Cluster, so it is its own PR.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v1.30.1/cnpg-1.30.1.yaml
