apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik
  namespace: authentik
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`id.mia.cx`) || Host(`authentik.yggdrasil.mia.cx`)
      kind: Rule
      services:
        - name: authentik-server
          port: 80
  tls: {}
