## Sign-in sources only sign in existing accounts. "Sign in with Google"
## signs in Hecate accounts already linked to that Google identity and
## refuses unknown ones, because the source has no enrollment flow. Google
## replaces the password, not MFA: like the password sign-in, the flow asks
## for a second factor when the account has one. The source and its OAuth
## client live only in Hecate, so the source entry updates it in place and is
## skipped where it doesn't exist.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-sources
  namespace: authentik
data:
  sources.yaml: |
    version: 1
    metadata:
      name: Sign-in sources
      labels:
        blueprints.goauthentik.io/description: sign-in sources only sign in existing accounts
    entries:
      - model: authentik_flows.flow
        id: flow
        identifiers: {slug: hecate-source-sign-in}
        attrs:
          name: Hecate source sign-in
          title: Signing you in
          designation: authentication
          authentication: none
      # Only reachable from a source callback, never by opening the flow URL.
      - model: authentik_policies_expression.expressionpolicy
        id: from-source
        identifiers: {name: hecate-source-sign-in-from-source}
        attrs:
          expression: return ak_is_sso_flow
      - model: authentik_policies.policybinding
        identifiers: {target: !KeyOf flow, order: 0}
        attrs: {policy: !KeyOf from-source}

      - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
        id: mfa
        identifiers: {name: hecate-source-sign-in-mfa}
        attrs:
          device_classes: [static, totp, webauthn, duo, sms, email]
          not_configured_action: skip
      - model: authentik_stages_user_login.userloginstage
        id: login
        identifiers: {name: hecate-source-sign-in-login}
      - model: authentik_flows.flowstagebinding
        identifiers: {target: !KeyOf flow, stage: !KeyOf mfa, order: 10}
      - model: authentik_flows.flowstagebinding
        identifiers: {target: !KeyOf flow, stage: !KeyOf login, order: 20}

      - model: authentik_sources_oauth.oauthsource
        identifiers: {slug: google}
        conditions:
          - !Find [authentik_sources_oauth.oauthsource, [slug, google]]
        attrs:
          enrollment_flow: null
          authentication_flow: !KeyOf flow
