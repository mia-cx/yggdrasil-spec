authentik:
  secret_key: ""  # Will use existingSecret
  error_reporting:
    enabled: false
  postgresql:
    password: ""  # Will use existingSecret
  email:
    from: noreply@id.mia.cx
    host: smtppro.zoho.eu
    password: ""  # Set via AUTHENTIK_EMAIL__PASSWORD env below
    port: 465
    timeout: 30
    use_ssl: true
    use_tls: false
    username: mia@mia.cx

global:
  env:
    - name: AUTHENTIK_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: secret-key
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: postgresql-password
    - name: AUTHENTIK_EMAIL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: email-password

server:
  replicas: 1
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: workloads/critical
                operator: Exists
              - key: authentik-prefer
                operator: In
                values:
                  - high
  ingress:
    enabled: false  # We'll use IngressRoute instead

worker:
  replicas: 1
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: workloads/critical
                operator: Exists
              - key: authentik-prefer
                operator: In
                values:
                  - high

postgresql:
  enabled: true
  auth:
    existingSecret: authentik-secrets
    secretKeys:
      adminPasswordKey: postgresql-password
      userPasswordKey: postgresql-password
  primary:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: workloads/critical
                  operator: Exists
                - key: authentik-prefer
                  operator: In
                  values:
                    - high
    persistence:
      enabled: true
      size: 8Gi
      storageClass: longhorn

redis:
  enabled: true
  image:
    registry: docker.io
    repository: bitnami/redis
    tag: latest
    pullPolicy: Always
  architecture: standalone
  auth:
    enabled: false
  master:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: workloads/critical
                  operator: Exists
                - key: authentik-prefer
                  operator: In
                  values:
                    - high
    persistence:
      enabled: true
      size: 1Gi
      storageClass: longhorn