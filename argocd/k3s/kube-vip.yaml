## Static pod: copy to /var/lib/rancher/k3s/agent/pod-manifests/kube-vip.yaml on every server node.
## Announces the control-plane VIP 10.0.128.1 and LoadBalancer Service VIPs over ARP.
## Leader election goes through the local apiserver, so the lease timings must outlast
## a stalled apiserver: at 5/3/1 s, any stall over 3 s dropped every VIP.
apiVersion: v1
kind: Pod
metadata:
  name: kube-vip
  namespace: kube-system
spec:
  hostNetwork: true
  priorityClassName: system-node-critical
  hostAliases:
    - hostnames:
        - kubernetes
      ip: 127.0.0.1
  containers:
    - name: kube-vip
      image: ghcr.io/kube-vip/kube-vip:v1.2.4
      imagePullPolicy: IfNotPresent
      args:
        - manager
      env:
        - name: vip_arp
          value: "true"
        - name: port
          value: "6443"
        - name: vip_interface
          value: ens18
        - name: vip_subnet
          value: "16"
        - name: cp_enable
          value: "true"
        - name: cp_namespace
          value: kube-system
        - name: svc_enable
          value: "true"
        - name: vip_leaderelection
          value: "true"
        - name: vip_leasename
          value: plndr-cp-lock
        - name: vip_leaseduration
          value: "30"
        - name: vip_renewdeadline
          value: "20"
        - name: vip_retryperiod
          value: "4"
        - name: address
          value: "10.0.128.1"
      securityContext:
        capabilities:
          add:
            - NET_ADMIN
            - NET_RAW
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
      volumeMounts:
        - mountPath: /etc/kubernetes/admin.conf
          name: kubeconfig
  volumes:
    - name: kubeconfig
      hostPath:
        path: /etc/rancher/k3s/k3s.yaml
