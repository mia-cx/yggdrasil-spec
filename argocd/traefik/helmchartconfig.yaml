## K3s Traefik customization — enables cross-namespace references
## Required for: middlewares in kube-system referenced by service IngressRoutes,
## and wildcard-tls secret in kube-system used by TLSStore default
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
