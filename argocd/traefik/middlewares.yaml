## Internal-Only — restricts to LAN + Netbird overlay clients (system-wide)
## Requires Traefik HelmChartConfig: providers.kubernetesCRD.allowCrossNamespace: true
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: internal-only
  namespace: kube-system
spec:
  ipAllowList:
    sourceRange:
      - 10.0.0.0/8        # LAN
      - 100.64.0.0/10      # Netbird overlay (default CGNAT range)
      # adjust to your actual Netbird address space
---
## Authentik Forward Auth — protects routes requiring SSO
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik
  namespace: kube-system
spec:
  forwardAuth:
    address: http://authentik-server.authentik/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-entitlements
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version