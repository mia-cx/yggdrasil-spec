## K3s Traefik customization — cross-namespace middlewares + real client IP to backends
## Required for: middlewares in kube-system referenced by IngressRoutes in any namespace
## 1. service.spec.externalTrafficPolicy: Local — preserve client IP so Traefik sees real source (not node SNAT)
## 2. forwardedHeaders.trustedIPs — Traefik trusts X-Forwarded-* from upstream (router/LAN/Netbird)
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    # Preserve client IP: Service forwards without SNAT so Traefik gets real source and sets X-Forwarded-For correctly
    # Management/architecture: no node affinity — scheduler decides (see workload-placement.md)
    # System-wide middleware: allow IngressRoutes in any namespace to reference middlewares in kube-system
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
    # Access logs via chart values (avoids "field not found, node: logs" from raw CLI flags)
    logs:
      access:
        enabled: true
        format: json
        fields:
          headers:
            defaultmode: keep
            names:
              X-Forwarded-For: keep
              X-Forwarded-Proto: keep
    # Entrypoint forwardedHeaders not exposed as chart values; keep as CLI args only
    additionalArguments:
      - "--entryPoints.web.forwardedHeaders.trustedIPs=10.0.0.0/8,100.64.0.0/10"
      - "--entryPoints.web.forwardedHeaders.insecure=false"
      - "--entryPoints.websecure.forwardedHeaders.trustedIPs=10.0.0.0/8,100.64.0.0/10"
      - "--entryPoints.websecure.forwardedHeaders.insecure=false"
