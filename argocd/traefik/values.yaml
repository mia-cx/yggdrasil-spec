## Traefik Helm values — official traefik/traefik chart
## Repo: https://traefik.github.io/charts
##
## Migrated from K3s built-in Traefik (HelmChartConfig). Deploy only after
## disabling K3s Traefik: add --disable=traefik to K3s server args.

# externalTrafficPolicy: Local preserves client IP for internal-only middleware but can break
# connectivity when kube-vip + single-replica Traefik: traffic from some LAN sources (e.g. 10.0.15.x)
# may timeout while traffic from K3s nodes works. Use Cluster if Local causes issues; trade-off
# is SNAT (Traefik may see node IP instead of real client); internal-only still works if the
# connection comes from a node in the same site.
service:
  spec:
    externalTrafficPolicy: Cluster  # was Local; revert if client IP preservation is required

# Allow IngressRoutes in any namespace to reference middlewares in kube-system
providers:
  kubernetesCRD:
    allowCrossNamespace: true

# Access logs
logs:
  access:
    enabled: true
    format: json
    fields:
      headers:
        defaultmode: keep
        names:
          X-Forwarded-For: keep
          X-Forwarded-Proto: keep

# SFTP entry point for Wings nodes (port 2022)
ports:
  sftp:
    port: 2022
    expose:
      default: true
      exposedPort: 2022
    protocol: TCP

# Entrypoint forwardedHeaders not exposed as chart values — use CLI args
# Trust X-Forwarded-* from LAN (10.0.0.0/8) and Netbird overlay (100.64.0.0/10)
additionalArguments:
  - "--providers.kubernetesCRD.allowCrossNamespace=true"
  - "--entryPoints.web.forwardedHeaders.trustedIPs=10.0.0.0/8,100.64.0.0/10"
  - "--entryPoints.web.forwardedHeaders.insecure=false"
  - "--entryPoints.websecure.forwardedHeaders.trustedIPs=10.0.0.0/8,100.64.0.0/10"
  - "--entryPoints.websecure.forwardedHeaders.insecure=false"
