## Traefik Helm values — official traefik/traefik chart
## Repo: https://traefik.github.io/charts
##
## Migrated from K3s built-in Traefik (HelmChartConfig). Deploy only after
## disabling K3s Traefik: add --disable=traefik to K3s server args.

image:
  tag: "3.6.10"

# Keep externalTrafficPolicy: Local so Traefik preserves the real client IP.
# kube-vip service election makes the VIP follow nodes that have a local Traefik pod,
# and Traefik is replicated across hosts so a single node loss does not blackhole ingress.
service:
  spec:
    externalTrafficPolicy: Local

deployment:
  replicas: 2

podDisruptionBudget:
  enabled: true
  minAvailable: 1

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: workloads/critical
              operator: Exists
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
        topologyKey: kubernetes.io/hostname

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: traefik

# Allow IngressRoutes in any namespace to reference middlewares in kube-system
providers:
  kubernetesCRD:
    allowCrossNamespace: true

# Access logs
logs:
  access:
    enabled: true
    format: json
    fields:
      headers:
        defaultmode: keep
        names:
          X-Forwarded-For: keep
          X-Forwarded-Proto: keep

# Entrypoint forwardedHeaders not exposed as chart values — use CLI args
# Trust X-Forwarded-* from LAN (10.0.0.0/8) and Netbird overlay (100.64.0.0/10)
# readTimeout=0 disables timeout so Jellyfin streams and offline downloads don't drop after ~5 min
additionalArguments:
  - "--providers.kubernetesCRD.allowCrossNamespace=true"
  - "--entryPoints.web.forwardedHeaders.trustedIPs=10.0.0.0/8,100.64.0.0/10"
  - "--entryPoints.web.forwardedHeaders.insecure=false"
  - "--entryPoints.websecure.forwardedHeaders.trustedIPs=10.0.0.0/8,100.64.0.0/10"
  - "--entryPoints.websecure.forwardedHeaders.insecure=false"
  - "--entryPoints.websecure.transport.respondingTimeouts.readTimeout=0"
  - "--entryPoints.websecure.transport.respondingTimeouts.writeTimeout=0"
