## Authentik-protected web endpoint for OAuth setup/callbacks. Mesh-only:
## served by the private Traefik, see argocd/traefik-internal/README.md.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: email-oauth2-proxy
  namespace: email-oauth2-proxy
  annotations:
    kubernetes.io/ingress.class: traefik-internal
spec:
  entryPoints: [smtproxy]
  routes:
    - match: Host(`smtproxy.yggdrasil.mia.cx`)
      kind: Rule
      middlewares:
        - name: authentik
      services:
        - name: email-oauth2-proxy
          port: 8080
  tls:
    secretName: smtproxy-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: smtproxy-tls
  namespace: email-oauth2-proxy
spec:
  secretName: smtproxy-tls
  dnsNames: [smtproxy.yggdrasil.mia.cx]
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
