## Helm values for Prowlarr on K3s
## Chart: bjw-s/app-template (v3)
## Repo: https://bjw-s-labs.github.io/helm-charts

controllers:
  main:
    pod:
      securityContext:
        fsGroup: 1000
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workloads/media
                    operator: Exists
                  - key: workloads/downloading
                    operator: Exists
    containers:
      main:
        image:
          repository: lscr.io/linuxserver/prowlarr
          tag: latest
          pullPolicy: IfNotPresent
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: Europe/Amsterdam
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

service:
  main:
    controller: main
    ports:
      http:
        port: 9696

ingress:
  main:
    enabled: false

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 2Gi
    storageClass: longhorn
    globalMounts:
      - path: /config
