apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pelican
  namespace: pelican
  # Mesh-only since PHP2Shell (CVE-2026-109618/9): served by the private
  # Traefik, see argocd/traefik-internal/README.md.
  annotations:
    kubernetes.io/ingress.class: traefik-internal
spec:
  entryPoints: [pelican]
  routes:
    - match: Host(`panel.mia.cx`)
      kind: Rule
      services:
        - name: pelican
          port: 80
  tls:
    secretName: pelican-tls
---
# Wings (hermes-olympus-1, 10.0.1.6) calls back into the panel's remote API.
# The public Traefik keeps that path for the Wings VM alone; it preserves
# client IPs (externalTrafficPolicy: Local).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pelican-wings-remote
  namespace: pelican
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`panel.mia.cx`) && PathPrefix(`/api/remote`) && ClientIP(`10.0.1.6/32`)
      kind: Rule
      services:
        - name: pelican
          port: 80
  tls: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pelican-tls
  namespace: pelican
spec:
  secretName: pelican-tls
  dnsNames: [panel.mia.cx]
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
