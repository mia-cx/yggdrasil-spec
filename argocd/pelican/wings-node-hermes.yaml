## Wings node on athena (hermes-olympus-1)
## Selector-less Service + EndpointSlice to route Traefik to the Wings VM
## Update endpoints.addresses if hermes-olympus-1 has a different IP
---
apiVersion: v1
kind: Service
metadata:
  name: wings-hermes-olympus-1
  namespace: pelican
spec:
  ports:
    - name: wings-api
      port: 8080
      targetPort: 8080
    - name: wings-sftp
      port: 2022
      targetPort: 2022
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: wings-hermes-olympus-1-external
  namespace: pelican
  labels:
    kubernetes.io/service-name: wings-hermes-olympus-1
addressType: IPv4
endpoints:
  - addresses:
      - "10.0.1.6"  # hermes-olympus-1 (Wings VM on athena)
    conditions:
      ready: true
ports:
  - name: wings-api
    port: 8080
    protocol: TCP
  - name: wings-sftp
    port: 2022
    protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: wings-hermes-olympus-1
  namespace: pelican
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`hermes-olympus-1.yggdrasil.mia.cx`)
      kind: Rule
      services:
        - name: wings-hermes-olympus-1
          port: 8080
  tls: {}
---
## SFTP TCP router — routes port 2022 to hermes-olympus-1
## Connect: sftp -P 2022 uuid@hermes-olympus-1.yggdrasil.mia.cx
## Router must forward 2022 → Traefik LoadBalancer (10.0.128.2)
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: wings-hermes-olympus-1-sftp
  namespace: pelican
spec:
  entryPoints: [sftp]
  routes:
    - match: HostSNI(`*`)
      services:
        - name: wings-hermes-olympus-1
          port: 2022
