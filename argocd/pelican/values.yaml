## Helm values for Pelican Panel on K3s
## Chart: bjw-s/app-template (v5)
## Repo: https://bjw-s-labs.github.io/helm-charts
##
## Game server management (Pterodactyl fork). Panel in K3s; Wings on dedicated VM.

controllers:
  main:
    pod:
      securityContext:
        fsGroup: 82  # www-data GID (Alpine); makes PVCs writable
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workloads/games
                    operator: Exists
    containers:
      main:
        image:
          repository: ghcr.io/pelican-dev/panel
          tag: latest@sha256:45cecf27176630ac628ebc9badc0ad273bdaa9bf441648c363dd8daeb9cc3bff
          pullPolicy: IfNotPresent
        env:
          XDG_DATA_HOME: /pelican-data
          APP_URL: https://panel.mia.cx
          ADMIN_EMAIL: mia@mia.cx  # Used by installer; set to your email
          BEHIND_PROXY: "true"  # Skip LE_EMAIL check; Traefik handles TLS
          DB_CONNECTION: pgsql
          DB_HOST: pelican-database-rw
          DB_PORT: "5432"
          DB_DATABASE: panel
          REDIS_HOST: pelican-valkey
          REDIS_PORT: "6379"
          SESSION_DRIVER: redis
          CACHE_STORE: redis
          DB_USERNAME:
            valueFrom:
              secretKeyRef:
                name: pelican-database-app
                key: username
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: pelican-database-app
                key: password
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi

service:
  main:
    controller: main
    ports:
      http:
        port: 80

ingress:
  main:
    enabled: false  # Using Traefik IngressRoute — see ingressroute.yaml
    hosts:
      - panel.mia.cx  # Required by chart schema; not used when enabled: false

persistence:
  data:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 10Gi
    storageClass: longhorn
    globalMounts:
      - path: /pelican-data
  logs:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 2Gi
    storageClass: longhorn
    globalMounts:
      - path: /var/www/html/storage/logs
