image:
  repository: ghcr.io/mia-cx/honeybot
  tag: v1.1.1
  pullPolicy: IfNotPresent

secret:
  create: false
  existingSecret: honeybot-secrets

env:
  GLOBAL_AUTH_MODE: team
  GLOBAL_AUTH_TEAM_ID: "1523848476851437578"

persistence:
  enabled: true
  storageClass: longhorn
  size: 5Gi

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: workloads/critical
              operator: Exists

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
