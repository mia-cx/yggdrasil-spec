apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lidarr
  namespace: media
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`lidarr.yggdrasil.mia.cx`)
      kind: Rule
      middlewares:
        - name: internal-only
          namespace: kube-system
      services:
        - name: lidarr
          port: 8686
  tls: {}
