apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lidarr
  namespace: media
  # Mesh-only: served by the private Traefik, see
  # argocd/traefik-internal/README.md.
  annotations:
    kubernetes.io/ingress.class: traefik-internal
spec:
  entryPoints: [lidarr]
  routes:
    - match: Host(`lidarr.yggdrasil.mia.cx`)
      kind: Rule
      middlewares:
        - name: authentik
      services:
        - name: lidarr
          port: 8686
  tls:
    secretName: lidarr-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lidarr-tls
  namespace: media
spec:
  secretName: lidarr-tls
  dnsNames: [lidarr.yggdrasil.mia.cx]
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
