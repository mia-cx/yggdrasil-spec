## Helm values for Tunarr on K3s
## Chart: bjw-s/app-template (v3)
## Repo: https://bjw-s-labs.github.io/helm-charts
##
## Tunarr: IPTV / live TV channels from Plex/Jellyfin/Emby.
## Tunarr persists db, settings, backups to /config/tunarr (see tunarr.com/getting-started/run).
## Mount the PVC at that path to match official Docker/compose examples.

controllers:
  main:
    strategy: Recreate  # Required for RWO volume — prevents rollout blocking
    pod:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workloads/media
                    operator: Exists
    containers:
      main:
        image:
          repository: docker.io/chrisbenincasa/tunarr
          tag: 1.3.14
          pullPolicy: IfNotPresent
        env:
          TZ: Europe/Amsterdam
          LOG_LEVEL: INFO
          # Kubernetes cgroup v2 is not detected as a container by Tunarr.
          # Set the documented data directory explicitly so the PVC is used.
          TUNARR_DATABASE_PATH: /config/tunarr
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        ## Hardware transcoding (uncomment when node has GPU):
        #   limits:
        #     gpu.intel.com/i915: 1

service:
  main:
    controller: main
    ports:
      http:
        port: 8000

ingress:
  main:
    enabled: false
    hosts:
      - tunarr.yggdrasil.mia.cx

persistence:
  config:
    enabled: true
    existingClaim: tunarr-config  # Explicit PVC in pvc.yaml — survives restarts
    globalMounts:
      - path: /config/tunarr
