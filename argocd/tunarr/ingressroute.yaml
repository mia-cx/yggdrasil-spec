apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tunarr
  namespace: media
  # Mesh-only: served by the private Traefik, see
  # argocd/traefik-internal/README.md.
  annotations:
    kubernetes.io/ingress.class: traefik-internal
spec:
  entryPoints: [tunarr]
  routes:
    - match: Host(`tunarr.yggdrasil.mia.cx`)
      kind: Rule
      middlewares:
        - name: authentik
      services:
        - name: tunarr
          port: 8000
  tls:
    secretName: tunarr-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tunarr-tls
  namespace: media
spec:
  secretName: tunarr-tls
  dnsNames: [tunarr.yggdrasil.mia.cx]
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
