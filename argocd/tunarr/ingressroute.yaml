apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tunarr
  namespace: media
  # Mesh-only until Tunarr ships Node.js 22.23.4 or later (CVE-2026-111497):
  # served by the private Traefik, see argocd/traefik-internal/README.md.
  annotations:
    kubernetes.io/ingress.class: traefik-internal
spec:
  entryPoints: [tunarr]
  routes:
    - match: Host(`tunarr.yggdrasil.mia.cx`)
      kind: Rule
      middlewares:
        - name: tunarr-authentik
      services:
        - name: tunarr
          port: 8000
  tls:
    secretName: tunarr-tls
---
# The private Traefik cannot reference kube-system/authentik across
# namespaces, so this is a local copy of that forward-auth middleware.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tunarr-authentik
  namespace: media
spec:
  forwardAuth:
    address: http://ak-outpost-authentik-embedded-outpost.authentik:9000/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-entitlements
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tunarr-tls
  namespace: media
spec:
  secretName: tunarr-tls
  dnsNames: [tunarr.yggdrasil.mia.cx]
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
