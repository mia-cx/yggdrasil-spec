apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: tastebase-db
  namespace: tastebase
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # Create DB before the apps that use it
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie # standard images ship pgvector
  instances: 2

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: workloads/critical
                operator: Exists

  storage:
    size: 20Gi
    storageClass: longhorn
    resizeInUseVolumes: true

  resources:
    requests:
      memory: 1Gi
      cpu: 250m
    limits:
      memory: 4Gi

  postgresql:
    parameters:
      shared_buffers: "1GB"
      maintenance_work_mem: "1GB"

  # CNPG writes the owner's password to Secret tastebase-db-app.
  bootstrap:
    initdb:
      database: tastebase
      owner: tastebase
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;

  # LAN endpoint for the ingest worker on Athena (10.0.3.2). CNPG creates a
  # LoadBalancer Service named tastebase-db-lan targeting the rw endpoint;
  # kube-vip pins it to 10.0.128.6.
  managed:
    services:
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: tastebase-db-lan
            spec:
              type: LoadBalancer
              loadBalancerIP: 10.0.128.6
