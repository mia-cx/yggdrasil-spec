# Mesh destination for t3.yggdrasil.mia.cx (T3 Code MCP). The NetBird DNS
# zone answers this pinned ClusterIP, so it must never change; see the README
# allocation table.
apiVersion: v1
kind: Service
metadata:
  name: t3code
  namespace: traefik-internal
spec:
  type: ClusterIP
  clusterIP: 10.43.0.154
  ports:
    - name: https
      port: 443
      protocol: TCP
      targetPort: t3code
  selector:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik-internal-traefik-internal
