## Private Traefik — same chart as the public instance, isolated by class.
## Mesh-only: reachable only through NetBird routing pods, never through the
## public Traefik or the LAN.

image:
  tag: "3.7.16"

# No IngressClass object: the public instance keeps the default. Private
# routes opt in per IngressRoute via the annotation below.
ingressClass:
  enabled: false

providers:
  kubernetesCRD:
    # The public Traefik's provider class is unset, so it processes only
    # routes with no class annotation or class `traefik`. Annotated
    # `kubernetes.io/ingress.class: traefik-internal` routes land here only.
    ingressClass: traefik-internal
    # Explicit list, not cluster-wide: new namespaces opt in deliberately.
    namespaces:
      - canary
      - open-wearables
      - oddreads
      - cliproxyapi
      - nextcloud
      - pelican
      - immich
      - media
      - argocd
      - hermes
      - ms365-mcp
      - email-oauth2-proxy
      - speedtest
      - vaultwarden
      - defriend
      - t3code
    allowCrossNamespace: false
  kubernetesIngress:
    enabled: false

# No chart Service: each private service gets its own entrypoint port and a
# hand-written pinned ClusterIP (see canary-service.yaml) so NetBird
# L3/L4 policies can address it.
service:
  enabled: false

# One entrypoint per private service. kube-proxy maps the service's
# ClusterIP:443 to this pod port; the ports below stay unexposed.
ports:
  canary:
    port: 10001
    expose:
      default: false
    protocol: TCP
  open-wearables:
    port: 10002
    expose:
      default: false
    protocol: TCP
  oddreads:
    port: 10003
    expose:
      default: false
    protocol: TCP
  cliproxyapi:
    port: 10004
    expose:
      default: false
    protocol: TCP
  cpa-usage:
    port: 10005
    expose:
      default: false
    protocol: TCP
  nextcloud:
    port: 10006
    expose:
      default: false
    protocol: TCP
  pelican:
    port: 10007
    expose:
      default: false
    protocol: TCP
  immich:
    port: 10008
    expose:
      default: false
    protocol: TCP
    # Like the public websecure entrypoint: large uploads and video
    # downloads outlast Traefik's 60-second default.
    transport:
      respondingTimeouts:
        readTimeout: 0
        writeTimeout: 0
  tunarr:
    port: 10010
    expose:
      default: false
    protocol: TCP
  argocd:
    port: 10009
    expose:
      default: false
    protocol: TCP
  jellyfin:
    port: 10011
    expose:
      default: false
    protocol: TCP
    # Streams and offline downloads outlast Traefik's 60-second default.
    transport:
      respondingTimeouts:
        readTimeout: 0
        writeTimeout: 0
  seerr:
    port: 10012
    expose:
      default: false
    protocol: TCP
  prowlarr:
    port: 10013
    expose:
      default: false
    protocol: TCP
  sonarr:
    port: 10014
    expose:
      default: false
    protocol: TCP
  radarr:
    port: 10015
    expose:
      default: false
    protocol: TCP
  lidarr:
    port: 10016
    expose:
      default: false
    protocol: TCP
  readarr:
    port: 10017
    expose:
      default: false
    protocol: TCP
  sabnzbd:
    port: 10018
    expose:
      default: false
    protocol: TCP
  qbittorrent:
    port: 10019
    expose:
      default: false
    protocol: TCP
  hermes:
    port: 10020
    expose:
      default: false
    protocol: TCP
  ms365-mcp:
    port: 10021
    expose:
      default: false
    protocol: TCP
  smtproxy:
    port: 10022
    expose:
      default: false
    protocol: TCP
  wings:
    port: 10023
    expose:
      default: false
    protocol: TCP
    # Console WebSockets and file transfers stay open for long periods.
    transport:
      respondingTimeouts:
        readTimeout: 0
        writeTimeout: 0
  speedtest:
    port: 10024
    expose:
      default: false
    protocol: TCP
  vaultwarden:
    port: 10025
    expose:
      default: false
    protocol: TCP
  defriend:
    port: 10026
    expose:
      default: false
    protocol: TCP
  t3code:
    port: 10027
    expose:
      default: false
    protocol: TCP

# Same HA shape as the public instance.
deployment:
  replicas: 2

# With 2 replicas plus required anti-affinity, a surge pod cannot schedule;
# roll one pod at a time.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

podDisruptionBudget:
  enabled: true
  minAvailable: 1

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: workloads/critical
              operator: Exists
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/instance: traefik-internal-traefik-internal
        topologyKey: kubernetes.io/hostname

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/instance: traefik-internal-traefik-internal
