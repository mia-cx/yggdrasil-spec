# Pinned ClusterIP for the canary destination. The NetBird DNS zone resolves
# canary.mia.cx to this address, so it must never change. 10.43.250.0/24 is
# reserved for private per-service ClusterIPs (see README allocation table).
apiVersion: v1
kind: Service
metadata:
  name: canary
  namespace: traefik-internal
spec:
  type: ClusterIP
  clusterIP: 10.43.250.1
  ports:
    - name: https
      port: 443
      protocol: TCP
      # Pod port of the `canary` Traefik entrypoint (containerPort 10001).
      targetPort: canary
  selector:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik-internal-traefik-internal
