# Mesh destination for health.mia.cx (Open Wearables). The NetBird DNS zone
# answers this pinned ClusterIP, so it must never change; see the README
# allocation table.
apiVersion: v1
kind: Service
metadata:
  name: open-wearables
  namespace: traefik-internal
spec:
  type: ClusterIP
  clusterIP: 10.43.0.129
  ports:
    - name: https
      port: 443
      protocol: TCP
      # Pod port of the `open-wearables` Traefik entrypoint (containerPort 10002).
      targetPort: open-wearables
  selector:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik-internal-traefik-internal
