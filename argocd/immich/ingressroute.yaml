---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: immich
  namespace: immich
  # Mesh-only until Immich ships Node.js 24.22.1 (CVE-2026-111497): served by
  # the private Traefik, see argocd/traefik-internal/README.md.
  annotations:
    kubernetes.io/ingress.class: traefik-internal
spec:
  entryPoints: [immich]
  routes:
    - match: Host(`photos.mia.cx`)
      kind: Rule
      services:
        - name: immich-server
          port: 2283
  tls:
    secretName: immich-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: immich-tls
  namespace: immich
spec:
  secretName: immich-tls
  dnsNames: [photos.mia.cx]
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
