apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: qbittorrent
  namespace: media
  # Mesh-only: served by the private Traefik, see
  # argocd/traefik-internal/README.md.
  annotations:
    kubernetes.io/ingress.class: traefik-internal
spec:
  entryPoints: [qbittorrent]
  routes:
    - match: Host(`qbittorrent.yggdrasil.mia.cx`)
      kind: Rule
      middlewares:
        - name: authentik
      services:
        - name: qbittorrent-main
          port: 8080
  tls:
    secretName: qbittorrent-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: qbittorrent-tls
  namespace: media
spec:
  secretName: qbittorrent-tls
  dnsNames: [qbittorrent.yggdrasil.mia.cx]
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
