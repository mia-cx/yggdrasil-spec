## Helm values for qBittorrent on K3s
## Chart: bjw-s/app-template (v3)
## Repo: https://bjw-s-labs.github.io/helm-charts

controllers:
  main:
    pod:
      securityContext:
        fsGroup: 1000
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workloads/media
                    operator: Exists
                  - key: workloads/downloading
                    operator: Exists
    containers:
      main:
        image:
          repository: lscr.io/linuxserver/qbittorrent
          tag: 5.1.4-r3-ls453
          pullPolicy: IfNotPresent
        env:
          PUID: "1000"
          PGID: "1000"
          WEBUI_PORT: &port 8080
          TORRENTING_PORT: &bt-port 50413
          TZ: Europe/Amsterdam
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 2000m
            memory: 4Gi

service:
  main:
    controller: main
    ports:
      http:
        port: *port
  bittorrent:
    controller: main
    type: LoadBalancer
    ports:
      bittorrent-tcp:
        port: *bt-port
        protocol: TCP
      bittorrent-udp:
        port: *bt-port
        protocol: UDP

ingress:
  main:
    enabled: false
    hosts:
      - qbittorrent.yggdrasil.mia.cx

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: qbittorrent
    globalMounts:
      - path: /config
  downloads:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: downloads-nfs-pvc
    globalMounts:
      - path: /downloads
  media:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: media-nfs-pvc
    globalMounts:
      - path: /media
