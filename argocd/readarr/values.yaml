## Helm values for Readarr on K3s
## Chart: bjw-s/app-template (v3)
## Repo: https://bjw-s-labs.github.io/helm-charts
## Readarr: ebook/audiobook automation (LinuxServer image; port 8787)
## Floating tags like "develop" currently resolve to zero images on Docker Hub.
## Pin to a concrete tag with a valid manifest list for amd64/arm64.

controllers:
  main:
    pod:
      securityContext:
        fsGroup: 1000
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workloads/media
                    operator: Exists
                  - key: workloads/downloading
                    operator: Exists
    containers:
      main:
        image:
          repository: docker.io/linuxserver/readarr
          tag: develop-0.4.18.2805-ls157
          pullPolicy: IfNotPresent
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: Europe/Amsterdam
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 4Gi

service:
  main:
    controller: main
    ports:
      http:
        port: 8787

ingress:
  main:
    enabled: false
    hosts:
      - readarr.yggdrasil.mia.cx

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: readarr
    globalMounts:
      - path: /config
  media:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: media-nfs-pvc
    globalMounts:
      - path: /media
  downloads:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: nvme-nfs-pvc
    globalMounts:
      - path: /downloads
        subPath: sabnzbd
