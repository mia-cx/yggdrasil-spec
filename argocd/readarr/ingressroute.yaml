apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: readarr
  namespace: media
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`readarr.yggdrasil.mia.cx`)
      kind: Rule
      middlewares:
        - name: internal-only
          namespace: kube-system
      services:
        - name: readarr
          port: 8787
  tls: {}
