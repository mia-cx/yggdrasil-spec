apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: readarr
  namespace: media
  # Mesh-only: served by the private Traefik, see
  # argocd/traefik-internal/README.md.
  annotations:
    kubernetes.io/ingress.class: traefik-internal
spec:
  entryPoints: [readarr]
  routes:
    - match: Host(`readarr.yggdrasil.mia.cx`)
      kind: Rule
      middlewares:
        - name: authentik
      services:
        - name: readarr
          port: 8787
  tls:
    secretName: readarr-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: readarr-tls
  namespace: media
spec:
  secretName: readarr-tls
  dnsNames: [readarr.yggdrasil.mia.cx]
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
