# `t3 serve` runs on athena-hephaestus, outside the cluster, so the private
# Traefik reaches it through a selector-less Service + EndpointSlice.
# Being off-cluster, it can't take the Ingress NetworkPolicy other private
# backends use; it is also reachable on the LAN at 10.0.3.2:3773.
apiVersion: v1
kind: Service
metadata:
  name: t3code
  namespace: t3code
spec:
  ports:
    - name: http
      port: 3773
      targetPort: 3773
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: t3code-external
  namespace: t3code
  labels:
    kubernetes.io/service-name: t3code
addressType: IPv4
endpoints:
  - addresses:
      - "10.0.3.2"  # athena-hephaestus
    conditions:
      ready: true
ports:
  - name: http
    port: 3773
    protocol: TCP
