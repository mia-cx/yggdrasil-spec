apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: discord-mcp
  namespace: discord-mcp
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`discord.mia.cx`)
      kind: Rule
      # Shared access logs retain headers, including per-request bot credentials.
      observability:
        accessLogs: false
      services:
        - name: discord-mcp-relay
          port: 3000
  # The existing Traefik TLSStore supplies the *.mia.cx certificate.
  tls: {}
