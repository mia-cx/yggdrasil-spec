## Helm values for SABnzbd on K3s
## Chart: bjw-s/app-template (v3)
## Repo: https://bjw-s-labs.github.io/helm-charts
##
## Downloads use NVMe NFS (subPath sabnzbd-downloads). Before first deploy:
## 1. On Storage LXC (10.0.1.2): mkdir -p /mnt/nvme/sabnzbd-downloads
## 2. Optional: rsync existing downloads from old location before switching.

controllers:
  main:
    annotations:
      argocd.argoproj.io/sync-options: Force=true,Replace=true
    pod:
      securityContext:
        fsGroup: 1000
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workloads/media
                    operator: Exists
                  - key: workloads/downloading
                    operator: Exists
    containers:
      main:
        image:
          repository: lscr.io/linuxserver/sabnzbd
          tag: 5.1.2-ls271
          pullPolicy: IfNotPresent
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: Europe/Amsterdam
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 4Gi

service:
  main:
    controller: main
    ports:
      http:
        port: 8080

ingress:
  main:
    enabled: false
    hosts:
      - sabnzbd.yggdrasil.mia.cx

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: sabnzbd
    globalMounts:
      - path: /config
  downloads:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: nvme-nfs-pvc
    globalMounts:
      - path: /downloads
        subPath: sabnzbd  # /mnt/nvme/sabnzbd-downloads on Storage LXC
  media:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: media-nfs-pvc
    globalMounts:
      - path: /media
