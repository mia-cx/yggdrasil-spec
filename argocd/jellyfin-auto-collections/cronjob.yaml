## Runs Jellyfin-Auto-Collections on a schedule (default: 04:00 daily).
## Requires Secret `jellyfin-auto-collections-secrets` with JELLYFIN_API_KEY, JELLYFIN_USER_ID.
## Optional: JELLYFIN_SERVER_URL (default below uses in-cluster Jellyfin).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: jellyfin-auto-collections
  namespace: media
spec:
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: OnFailure
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: workloads/media
                        operator: Exists
          containers:
            - name: jellyfin-auto-collections
              image: ghcr.io/ghomashudson/jellyfin-auto-collections:latest
              imagePullPolicy: IfNotPresent
              command:
                - python
                - main.py
                - --config
                - /app/config/config.yaml
              env:
                - name: JELLYFIN_SERVER_URL
                  value: "http://jellyfin.media:8096"
                - name: TZ
                  value: Europe/Amsterdam
              envFrom:
                - secretRef:
                    name: jellyfin-auto-collections-secrets
              volumeMounts:
                - name: config
                  mountPath: /app/config
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: config
              configMap:
                name: jellyfin-auto-collections-config
