## CloudNative-PG cluster for rreading-glasses (Readarr metadata API replacement).
## Operator creates secret rreading-glasses-db-app with app credentials.
## Ref: https://github.com/blampe/rreading-glasses
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: rreading-glasses-db
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: 1

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: workloads/media
                operator: Exists

  storage:
    size: 5Gi
    storageClass: longhorn

  bootstrap:
    initdb:
      database: rreading_glasses
      owner: rreading_glasses
