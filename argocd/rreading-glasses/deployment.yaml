## rreading-glasses: drop-in metadata API for Readarr (Goodreads).
## Readarr → Settings → Development (manual URL) → Metadata Provider Source = http://rreading-glasses.media:8788
## Ref: https://github.com/blampe/rreading-glasses
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rreading-glasses
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rreading-glasses
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: rreading-glasses
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workloads/media
                    operator: Exists
      containers:
        - name: rreading-glasses
          image: docker.io/blampe/rreading-glasses:latest
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --upstream=www.goodreads.com
            - --verbose
          ports:
            - containerPort: 8788
              name: http
          env:
            - name: POSTGRES_HOST
              value: rreading-glasses-db-rw.media.svc.cluster.local
            - name: POSTGRES_DATABASE
              value: rreading_glasses
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: rreading-glasses-db-app
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rreading-glasses-db-app
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rreading-glasses
  namespace: media
spec:
  selector:
    app: rreading-glasses
  ports:
    - name: http
      port: 8788
      targetPort: 8788
