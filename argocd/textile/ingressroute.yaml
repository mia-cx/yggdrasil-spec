# Mesh-only: the class annotation keeps this off the public Traefik; the
# private one serves it on the `textile` entrypoint only.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: textile
  namespace: textile
  annotations:
    kubernetes.io/ingress.class: traefik-internal
spec:
  entryPoints:
    - textile
  # One host: central's paths go to central, and everything else to the site.
  routes:
    - match: >-
        Host(`staging.textile.cx`) && (
        Path(`/mcp`) || Path(`/voice`) ||
        Path(`/register`) || Path(`/authorize`) || Path(`/token`) ||
        PathPrefix(`/auth/discord/`) ||
        Path(`/.well-known/oauth-authorization-server`) ||
        PathPrefix(`/.well-known/oauth-protected-resource`) ||
        PathPrefix(`/workflows/`) || PathPrefix(`/health/`))
      kind: Rule
      priority: 100
      services:
        - name: textile-central
          port: 3000
    - match: Host(`staging.textile.cx`)
      kind: Rule
      priority: 1
      services:
        - name: textile-web
          port: 8080
  tls:
    secretName: textile-tls
---
# Namespace-local certificate; nothing outside textile reads it.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: textile-tls
  namespace: textile
spec:
  secretName: textile-tls
  dnsNames:
    - staging.textile.cx
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
