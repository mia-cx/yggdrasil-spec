# Public: the website and the two central paths a browser needs to sign in.
# GET /authorize shows central's consent page and POST /authorize sends the
# person on to Discord; Discord then returns them to /auth/discord/callback,
# the application's only redirect. The site calls /register and /token
# server-side through central's Service, so they stay off this route. Central's
# other paths match neither rule and get the public Traefik's 404.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: textile-public
  namespace: textile
spec:
  entryPoints:
    - websecure
  routes:
    - match: >-
        Host(`textile.cx`) && (Path(`/authorize`) || Path(`/auth/discord/callback`))
      kind: Rule
      priority: 100
      # Shared access logs keep request headers, and the site's session cookie
      # holds a central access token.
      observability:
        accessLogs: false
      services:
        - name: textile-central
          port: 3000
    # Keep this list in step with central's paths on the private route below.
    - match: >-
        Host(`textile.cx`) && !(
        Path(`/mcp`) || Path(`/voice`) ||
        Path(`/register`) || Path(`/token`) ||
        Path(`/.well-known/oauth-authorization-server`) ||
        PathPrefix(`/.well-known/oauth-protected-resource`) ||
        PathPrefix(`/workflows/`) || PathPrefix(`/health/`))
      kind: Rule
      priority: 1
      observability:
        accessLogs: false
      services:
        - name: textile-web
          port: 8080
  # The wildcard in the default TLSStore is *.mia.cx, so name this one.
  tls:
    secretName: textile-tls
---
# Mesh: the class annotation keeps this off the public Traefik; the private one
# serves it on the `textile` entrypoint only. Mesh devices resolve textile.cx
# here, so they reach all of central, MCP included.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: textile
  namespace: textile
  annotations:
    kubernetes.io/ingress.class: traefik-internal
spec:
  entryPoints:
    - textile
  # One host: central's paths go to central, and everything else to the site.
  routes:
    - match: >-
        Host(`textile.cx`) && (
        Path(`/mcp`) || Path(`/voice`) ||
        Path(`/register`) || Path(`/authorize`) || Path(`/token`) ||
        PathPrefix(`/auth/discord/`) ||
        Path(`/.well-known/oauth-authorization-server`) ||
        PathPrefix(`/.well-known/oauth-protected-resource`) ||
        PathPrefix(`/workflows/`) || PathPrefix(`/health/`))
      kind: Rule
      priority: 100
      services:
        - name: textile-central
          port: 3000
    - match: Host(`textile.cx`)
      kind: Rule
      priority: 1
      services:
        - name: textile-web
          port: 8080
  tls:
    secretName: textile-tls
---
# Namespace-local certificate, served by both Traefiks.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: textile-tls
  namespace: textile
spec:
  secretName: textile-tls
  dnsNames:
    - textile.cx
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
