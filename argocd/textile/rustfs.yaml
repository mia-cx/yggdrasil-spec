# RustFS: the S3-compatible store Textile's database backs up to. One
# instance on a two-replica Longhorn volume, so a backup outlives either node.
# It is on the same cluster as the database, so it is not an off-site copy.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
  namespace: textile
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: textile
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  replicas: 1
  # The volume attaches to one pod at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rustfs
          # rustfs/rustfs 1.0.4
          image: rustfs/rustfs@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: s3
              containerPort: 9000
          env:
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: textile-rustfs
                  key: RUSTFS_ACCESS_KEY
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: textile-rustfs
                  key: RUSTFS_SECRET_KEY
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-data
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: textile
spec:
  selector:
    app: rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
# Only the database pods, including a scratch restore Cluster in this
# namespace, reach the store.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rustfs
  namespace: textile
spec:
  podSelector:
    matchLabels:
      app: rustfs
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: cnpg.io/cluster
                operator: Exists
      ports:
        - protocol: TCP
          port: 9000
