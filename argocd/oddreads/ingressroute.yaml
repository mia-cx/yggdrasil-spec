## oddreads — the review app for the shorts pipeline, on athena-hephaestus.
## Selector-less Service + EndpointSlice route Traefik to the app on :5190; internal DNS and the wildcard
## certificate cover slop.mia.cx, so it's reachable over NetBird only.
---
apiVersion: v1
kind: Service
metadata:
  name: oddreads
  namespace: oddreads
spec:
  ports:
    - name: http
      port: 5190
      targetPort: 5190
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: oddreads-external
  namespace: oddreads
  labels:
    kubernetes.io/service-name: oddreads
addressType: IPv4
endpoints:
  - addresses:
      - "10.0.3.2"  # athena-hephaestus
    conditions:
      ready: true
ports:
  - name: http
    port: 5190
    protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: oddreads
  namespace: oddreads
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`slop.mia.cx`)
      kind: Rule
      services:
        - name: oddreads
          port: 5190
  tls: {}
