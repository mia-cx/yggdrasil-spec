## Hermes Dashboard — external dashboard process on athena-hephaestus + Traefik IngressRoute
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes-dashboard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:mia-cx/yggdrasil-spec.git
    targetRevision: main
    path: argocd/hermes-dashboard
  destination:
    server: https://kubernetes.default.svc
    namespace: hermes
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
