## Pelican Valkey — Redis-compatible cache/sessions for Pelican Panel
## Official Valkey chart (BSD); Bitnami Redis has licensing changes
## Syncs before pelican (wave 0)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pelican-valkey
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://valkey.io/valkey-helm/
      chart: valkey
      targetRevision: "0.9.4"
      helm:
        releaseName: pelican-valkey
        valueFiles:
          - $values/argocd/pelican-valkey/values.yaml
    - repoURL: git@github.com:mia-cx/yggdrasil-spec.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: pelican
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
