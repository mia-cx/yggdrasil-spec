## Pelican Panel — Helm chart (bjw-s/app-template) + IngressRoute
## Game server management (Pterodactyl fork). Panel in K3s; Wings on dedicated VM.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pelican
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      targetRevision: 3.6.0  # Update to latest: helm search repo bjw-s/app-template
      helm:
        releaseName: pelican
        valueFiles:
          - $values/argocd/pelican/values.yaml
    - repoURL: git@github.com:mia-cx/yggdrasil-spec.git
      targetRevision: main
      ref: values
    - repoURL: git@github.com:mia-cx/yggdrasil-spec.git
      targetRevision: main
      path: argocd/pelican
      directory:
        exclude: '{values.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: pelican
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
