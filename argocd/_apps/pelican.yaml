apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pelican-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mia-cx/yggdrasil-spec.git
    targetRevision: main
    path: argocd/pelican
  destination:
    server: https://kubernetes.default.svc
    namespace: pelican
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
