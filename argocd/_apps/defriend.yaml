apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: defriend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:mia-cx/yggdrasil-spec.git
    targetRevision: main
    path: argocd/defriend
  destination:
    server: https://kubernetes.default.svc
    namespace: defriend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
