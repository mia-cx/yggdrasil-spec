## Jellyfin-Auto-Collections — CronJob (no upstream Helm chart)
## Syncs Jellyfin collections from IMDb, Letterboxd, mdblist, etc.
## Image: ghcr.io/ghomashudson/jellyfin-auto-collections
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin-auto-collections
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mia-cx/yggdrasil-spec.git
    targetRevision: main
    path: argocd/jellyfin-auto-collections
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
