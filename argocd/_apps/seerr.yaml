## Seerr — Helm chart (bjw-s/app-template) + companion manifests
## Media request and discovery for Jellyfin; integrates with Sonarr/Radarr
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seerr
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      targetRevision: 5.1.0
      helm:
        releaseName: seerr
        valueFiles:
          - $values/argocd/seerr/values.yaml
    - repoURL: git@github.com:mia-cx/yggdrasil-spec.git
      targetRevision: main
      ref: values
    - repoURL: git@github.com:mia-cx/yggdrasil-spec.git
      targetRevision: main
      path: argocd/seerr
      directory:
        exclude: '{values.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      enabled: false
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
