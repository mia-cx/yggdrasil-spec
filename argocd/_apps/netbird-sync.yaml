## netbird-sync — hourly Hecate -> NetBird permission sync (CronJob).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netbird-sync
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:mia-cx/yggdrasil-spec.git
    targetRevision: main
    path: argocd/netbird-sync
  destination:
    server: https://kubernetes.default.svc
    namespace: netbird-sync
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
