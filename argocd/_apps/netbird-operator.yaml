## NetBird operator — Helm chart + companion manifests (NetworkRouter)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netbird-operator
  namespace: argocd
spec:
  project: default
  sources:
    # Helm chart
    - repoURL: ghcr.io/netbirdio/helm-charts
      chart: netbird-operator
      targetRevision: 0.8.0
      helm:
        releaseName: netbird-operator
        valueFiles:
          - $values/argocd/netbird-operator/values.yaml
    # Git repo — values reference
    - repoURL: git@github.com:mia-cx/yggdrasil-spec.git
      targetRevision: main
      ref: values
    # Companion manifests (NetworkRouter)
    - repoURL: git@github.com:mia-cx/yggdrasil-spec.git
      targetRevision: main
      path: argocd/netbird-operator
      directory:
        exclude: "{values.yaml,README.md}"
  destination:
    server: https://kubernetes.default.svc
    namespace: netbird-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # CRDs are too large for client-side apply annotations.
      - ServerSideApply=true
