## Caelestis — Bun backend, Node frontend, and dedicated PostgreSQL cluster
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: caelestis
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/mia-riezebos/Caelestis.git
      targetRevision: d0afe08d0ad2e7b1e633bd391bf07f5385786401
      path: deploy/helm/caelestis
      helm:
        releaseName: tac
        valueFiles:
          - $values/argocd/caelestis/values.yaml
    - repoURL: git@github.com:mia-cx/yggdrasil-spec.git
      targetRevision: main
      ref: values
    - repoURL: git@github.com:mia-cx/yggdrasil-spec.git
      targetRevision: main
      path: argocd/caelestis
      directory:
        exclude: '{values.yaml,README.md}'
  destination:
    server: https://kubernetes.default.svc
    namespace: caelestis
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
