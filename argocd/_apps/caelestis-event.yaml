## Caelestis Event — a separate Caelestis server for Wplace events, sharing nothing with caelest.is
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: caelestis-event
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/mia-cx/Caelestis.git
      targetRevision: eb34b15f7d25b3b961714026160bd59be97447b9
      path: deploy/helm/caelestis
      helm:
        releaseName: event
        valueFiles:
          - $values/argocd/caelestis-event/values.yaml
    - repoURL: git@github.com:mia-cx/yggdrasil-spec.git
      targetRevision: main
      ref: values
    - repoURL: git@github.com:mia-cx/yggdrasil-spec.git
      targetRevision: main
      path: argocd/caelestis-event
      directory:
        exclude: '{values.yaml,README.md}'
  destination:
    server: https://kubernetes.default.svc
    namespace: caelestis-event
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
