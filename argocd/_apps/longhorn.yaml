## Longhorn: distributed block storage, adopted from the hand install in place.
## Sync is manual until the first sync is verified; see argocd/longhorn/README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    # Storage before any workload that claims a volume.
    argocd.argoproj.io/sync-wave: "-1"
    # Longhorn injects caBundles into its CRDs; a server-side diff leaves fields Longhorn owns alone.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: git@github.com:mia-cx/yggdrasil-spec.git
    targetRevision: main
    path: argocd/longhorn
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    syncOptions:
      # CRDs are too large for client-side apply annotations.
      - ServerSideApply=true
