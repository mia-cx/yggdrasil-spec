## CloudNativePG operator, upstream release manifest; see argocd/cnpg/README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg
  namespace: argocd
  annotations:
    # CRDs and the operator before any app that declares a database Cluster.
    argocd.argoproj.io/sync-wave: "-1"
    # The operator injects caBundles into its webhooks; a server-side diff leaves fields the operator owns alone.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: git@github.com:mia-cx/yggdrasil-spec.git
    targetRevision: main
    path: argocd/cnpg
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      # Never delete the operator or its CRDs because they left the manifest.
      prune: false
      selfHeal: true
    syncOptions:
      # CRDs are too large for client-side apply annotations.
      - ServerSideApply=true
