## rreading-glasses — Readarr metadata API replacement (Goodreads)
## Requires CloudNative-PG operator. Readarr points to http://rreading-glasses.media:8788 in Settings → Development.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rreading-glasses
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:mia-cx/yggdrasil-spec.git
    targetRevision: main
    path: argocd/rreading-glasses
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
