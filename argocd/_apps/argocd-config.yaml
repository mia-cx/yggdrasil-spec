## ArgoCD config — IngressRoute only.
## params-cm.yaml is excluded: it's documented here as SoT but applied manually.
## The ArgoCD installation itself is not managed via GitOps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:mia-cx/yggdrasil-spec.git
    targetRevision: main
    path: argocd/argocd
    directory:
      exclude: 'params-cm.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
