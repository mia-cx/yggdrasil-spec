apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: caelestis
  namespace: caelestis
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`tac.caelest.is`) && (Path(`/backend`) || PathPrefix(`/backend/`))
      kind: Rule
      priority: 100
      services:
        - name: caelestis-backend
          port: 3001
    - match: Host(`tac.caelest.is`)
      kind: Rule
      priority: 10
      services:
        - name: tac-caelestis
          port: 80
  tls:
    secretName: caelestis-tls
---
apiVersion: v1
kind: Service
metadata:
  name: caelestis-backend
  namespace: caelestis
spec:
  selector:
    app.kubernetes.io/name: caelestis
    app.kubernetes.io/instance: tac
  ports:
    - name: backend
      port: 3001
      targetPort: backend
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: caelestis-https
  namespace: caelestis
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: caelestis-http
  namespace: caelestis
spec:
  entryPoints: [web]
  routes:
    - match: Host(`tac.caelest.is`)
      kind: Rule
      middlewares:
        - name: caelestis-https
      services:
        - name: tac-caelestis
          port: 80
