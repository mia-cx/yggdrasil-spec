apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}-caelestis
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`{{ .Values.tenant.host }}`) && (Path(`/backend`) || PathPrefix(`/backend/`))
      kind: Rule
      priority: 100
      services:
        - name: {{ .Release.Name }}-caelestis-backend
          port: 3001
    - match: Host(`{{ .Values.tenant.host }}`)
      kind: Rule
      priority: 10
      services:
        - name: {{ .Release.Name }}-caelestis
          port: 80
  tls:
    secretName: caelestis-tls
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-caelestis-backend
spec:
  selector:
    app.kubernetes.io/name: caelestis
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: backend
      port: 3001
      targetPort: backend
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}-caelestis-http
spec:
  entryPoints: [web]
  routes:
    - match: Host(`{{ .Values.tenant.host }}`)
      kind: Rule
      middlewares:
        - name: caelestis-https
      services:
        - name: {{ .Release.Name }}-caelestis
          port: 80
