apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: caelestis-database
  namespace: caelestis
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  instances: 2
  affinity:
    nodeSelector:
      workloads/critical: "true"
  storage:
    size: 10Gi
    storageClass: longhorn
  bootstrap:
    initdb:
      database: caelestis
      owner: caelestis
