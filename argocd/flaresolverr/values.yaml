## Helm values for FlareSolverr on K3s
## Chart: bjw-s/app-template (v3)
## Repo: https://bjw-s-labs.github.io/helm-charts
##
## Internal service only — no IngressRoute needed.
## Prowlarr connects to: http://flaresolverr.media:8191

controllers:
  main:
    annotations:
      argocd.argoproj.io/sync-options: Force=true,Replace=true
    pod:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workloads/media
                    operator: Exists
                  - key: workloads/downloading
                    operator: Exists
    containers:
      main:
        image:
          repository: ghcr.io/flaresolverr/flaresolverr
          tag: v3.5.0
          pullPolicy: IfNotPresent
        env:
          LOG_LEVEL: info
          TZ: Europe/Amsterdam
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi

service:
  main:
    controller: main
    ports:
      http:
        port: 8191

ingress:
  main:
    enabled: false
    hosts:
      - flaresolverr.yggdrasil.mia.cx
