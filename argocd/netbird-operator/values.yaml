## NetBird operator values (chart netbird-operator 0.8.0).
## The API token Secret is created out-of-band; see README.md.
managementURL: https://netbird.mia.cx

# Routing pods run the same client version as the primary server.
routingClientImage: netbirdio/netbird:0.79.0

netbirdAPI:
  keyFromSecret:
    name: netbird-mgmt-api-key
    key: NB_API_KEY

webhook:
  # The sidecar-injection pod webhook fails closed. Only namespaces that opt in
  # are matched, so ordinary pod creation never depends on the operator.
  namespaceSelectors:
    - key: netbird.io/sidecar-injection
      operator: In
      values: ["enabled"]
