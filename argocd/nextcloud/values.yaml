## Helm values for nextcloud/nextcloud chart
## Repo: https://github.com/nextcloud/helm
## Install: helm repo add nextcloud https://nextcloud.github.io/helm/

image:
  tag: 33.0.3-apache

nextcloud:
  host: cloud.mia.cx
  existingSecret:
    enabled: true
    secretName: nextcloud-secrets
    usernameKey: nextcloud-username
    passwordKey: nextcloud-password
  extraEnv:
    - name: OVERWRITEPROTOCOL
      value: "https"
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
  configs:
    # Allow outbound HTTP to private IPs (e.g. id.mia.cx → 10.0.128.2 for OIDC discovery)
    local-server.config.php: |-
      <?php
      $CONFIG = array(
        'allow_local_remote_servers' => true,
      );
    server-id.config.php: |-
      <?php
      $CONFIG = array(
        # Each pod identifies itself by name — safe for single replica today,
        # correct automatically when scaled for HA.
        'server_identifier' => getenv('POD_NAME') ?: 'nextcloud',
      );
    proxy.config.php: |-
      <?php
      $CONFIG = array(
        # Trust any in-cluster proxy (Traefik pod); pod CIDR varies by CNI (10.42/10.43 common for K3s)
        # so use 10.0.0.0/8 so Nextcloud uses X-Forwarded-For and shows real client IP (LAN or public)
        'trusted_proxies' => ['10.0.0.0/8','100.64.0.0/10','10.42.0.0/16', '10.43.0.0/16'],
        'forwarded_for_headers' => ['HTTP_X_FORWARDED_FOR'],
        'overwriteprotocol' => 'https',
      );

internalDatabase:
  enabled: false

externalDatabase:
  enabled: false
  existingSecret:
    enabled: true
    secretName: nextcloud-mariadb
    usernameKey: db-username
    passwordKey: db-password

mariadb:
  enabled: true
  auth:
    database: nextcloud
    username: nextcloud
    existingSecret: nextcloud-mariadb
  primary:
    persistence:
      enabled: true
      storageClass: longhorn-single
      size: 10Gi

redis:
  enabled: true
  auth:
    enabled: false
  master:
    persistence:
      enabled: false

persistence:
  enabled: true
  existingClaim: nextcloud-pvc
  nextcloudData:
    enabled: true
    existingClaim: nextcloud-data-pvc

cronjob:
  enabled: true

startupProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 30

livenessProbe:
  enabled: true
  initialDelaySeconds: 30

readinessProbe:
  enabled: true
  initialDelaySeconds: 30

ingress:
  enabled: false  # Using Traefik IngressRoute

# Node affinity: schedule only on nodes with workloads/cloud-data (Immich, Nextcloud)
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: workloads/cloud-data
              operator: Exists

resources:
  requests:
    cpu: 200m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi
