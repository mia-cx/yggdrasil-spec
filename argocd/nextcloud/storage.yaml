apiVersion: v1
kind: Namespace
metadata:
  name: nextcloud
---
# App data — Longhorn (configs, database, html)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-pvc
  namespace: nextcloud
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-single
  resources:
    requests:
      storage: 50Gi
---
# User data — NFS (bulk storage)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nextcloud-nfs
spec:
  capacity:
    storage: 2Ti
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 10.0.1.2
    path: /mnt/nvme/nextcloud
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-data-pvc
  namespace: nextcloud
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 2Ti
  volumeName: nextcloud-nfs
  storageClassName: ""
