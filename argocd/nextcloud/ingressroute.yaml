apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`cloud.mia.cx`) || Host(`nextcloud.yggdrasil.mia.cx`)
      kind: Rule
      middlewares:
        - name: nextcloud-headers
          namespace: nextcloud
      services:
        - name: nextcloud
          port: 8080
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: nextcloud-headers
  namespace: nextcloud
spec:
  headers:
    stsSeconds: 15552000
    stsIncludeSubdomains: true
    stsPreload: true
    customRequestHeaders:
      X-Forwarded-Proto: https
    customResponseHeaders:
      X-Robots-Tag: "noindex, nofollow"
