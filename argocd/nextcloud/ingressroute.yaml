## Public, and on the mesh: peers in svc-nextcloud resolve cloud.mia.cx to the
## private Traefik (see argocd/traefik-internal/README.md); everyone else
## reaches the public route below.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nextcloud-public
  namespace: nextcloud
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`cloud.mia.cx`)
      kind: Rule
      middlewares:
        - name: nextcloud-dav-redirect
          namespace: nextcloud
        - name: nextcloud-ios-dav-legacy-redirect
          namespace: nextcloud
        - name: nextcloud-headers
          namespace: nextcloud
      services:
        - name: nextcloud
          port: 8080
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nextcloud
  namespace: nextcloud
  annotations:
    kubernetes.io/ingress.class: traefik-internal
spec:
  entryPoints: [nextcloud]
  routes:
    - match: Host(`cloud.mia.cx`)
      kind: Rule
      middlewares:
        - name: nextcloud-dav-redirect
          namespace: nextcloud
        - name: nextcloud-ios-dav-legacy-redirect
          namespace: nextcloud
        - name: nextcloud-headers
          namespace: nextcloud
      services:
        - name: nextcloud
          port: 8080
  tls:
    secretName: nextcloud-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nextcloud-tls
  namespace: nextcloud
spec:
  secretName: nextcloud-tls
  dnsNames: [cloud.mia.cx]
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: nextcloud-dav-redirect
  namespace: nextcloud
spec:
  redirectRegex:
    regex: '^https://([^/]+)/(\.well-known/)?(card|cal)dav/?$'
    replacement: 'https://${1}/remote.php/dav/'
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: nextcloud-ios-dav-legacy-redirect
  namespace: nextcloud
spec:
  redirectRegex:
    regex: '^https://([^/]+)/(principals|calendar/dav/[^/]+/user)/?$'
    replacement: 'https://${1}/remote.php/dav/'
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: nextcloud-headers
  namespace: nextcloud
spec:
  headers:
    stsSeconds: 15552000
    stsIncludeSubdomains: true
    stsPreload: true
    customRequestHeaders:
      X-Forwarded-Proto: https
    customResponseHeaders:
      X-Robots-Tag: "noindex, nofollow"
