## Browser-facing OAuth entrypoint only, Authentik-protected and mesh-only
## (private Traefik, see argocd/traefik-internal/README.md).
## /mcp stays cluster-internal for Hermes.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ms365-mcp-authorize
  namespace: ms365-mcp
  annotations:
    kubernetes.io/ingress.class: traefik-internal
spec:
  entryPoints: [ms365-mcp]
  routes:
    - match: Host(`ms365-mcp.yggdrasil.mia.cx`) && Path(`/authorize`)
      kind: Rule
      middlewares:
        - name: authentik
      services:
        - name: ms365-mcp
          port: 3000
  tls:
    secretName: ms365-mcp-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ms365-mcp-tls
  namespace: ms365-mcp
spec:
  secretName: ms365-mcp-tls
  dnsNames: [ms365-mcp.yggdrasil.mia.cx]
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
