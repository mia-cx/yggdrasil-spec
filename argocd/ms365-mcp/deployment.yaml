## MS365 MCP Server — HTTP MCP for Microsoft Graph.
##
## Secret required before sync:
##   kubectl create namespace ms365-mcp --dry-run=client -o yaml | kubectl apply -f -
##   kubectl create secret generic ms365-mcp-secrets -n ms365-mcp \
##     --from-literal=client-id='<entra-application-client-id>' \
##     --from-literal=client-secret='<entra-client-secret-value>' \
##     --from-literal=tenant-id='<entra-tenant-id>'
##
## Entra redirect URI for Hermes OAuth callback:
##   https://hermes.mia.cx/mcp-oauth/ms365/callback
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms365-mcp
  namespace: ms365-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms365-mcp
  template:
    metadata:
      labels:
        app: ms365-mcp
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workloads/critical
                    operator: Exists
      containers:
        - name: ms365-mcp
          image: node:22.23.2-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - exec npx -y @softeria/ms-365-mcp-server --http 3000 --org-mode --preset outlook,tasks
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: MS365_MCP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: ms365-mcp-secrets
                  key: client-id
            - name: MS365_MCP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ms365-mcp-secrets
                  key: client-secret
            - name: MS365_MCP_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: ms365-mcp-secrets
                  key: tenant-id
            - name: MS365_MCP_ORG_MODE
              value: "true"
            - name: MS365_MCP_OUTPUT_FORMAT
              value: toon
            # Do not set MS365_MCP_PUBLIC_URL: Hermes reaches /mcp and /token through an
            # internal/forwarded URL, while the browser-facing /authorize URL is manually
            # mapped to the public Authentik-protected ingress during login.
            - name: MS365_MCP_ALLOWED_REDIRECT_URIS
              value: https://hermes.mia.cx/mcp-oauth/ms365/callback,https://hermes.yggdrasil.mia.cx/mcp-oauth/ms365/callback
            # Delegated Graph access for the signed-in user's own resources plus
            # shared mailboxes/calendars/task lists they already have access to.
            # Tenant directory and contacts scopes stay excluded.
            # MailboxSettings.ReadWrite enables Outlook mail rules once triage patterns stabilize.
            - name: MS365_MCP_ALLOWED_SCOPES
              value: User.Read Mail.ReadWrite Mail.ReadWrite.Shared Mail.Send Mail.Send.Shared Calendars.ReadWrite Calendars.ReadWrite.Shared Tasks.ReadWrite Tasks.ReadWrite.Shared MailboxSettings.Read MailboxSettings.ReadWrite
            # Softeria derives the default OAuth request from enabled tool metadata;
            # append shared/mailbox-settings scopes explicitly so Entra can consent them.
            - name: MS365_MCP_EXTRA_SCOPES
              value: Mail.ReadWrite.Shared Mail.Send.Shared Calendars.ReadWrite.Shared Tasks.ReadWrite.Shared MailboxSettings.Read MailboxSettings.ReadWrite
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 512Mi
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: ms365-mcp
  namespace: ms365-mcp
spec:
  selector:
    app: ms365-mcp
  ports:
    - name: http
      port: 3000
      targetPort: http
---
## Private LAN/VPN endpoint for Hermes. This exposes /mcp and /token without
## Traefik/Authentik/public ingress; public browser auth still only uses the
## /authorize IngressRoute.
apiVersion: v1
kind: Service
metadata:
  name: ms365-mcp-private
  namespace: ms365-mcp
spec:
  type: LoadBalancer
  loadBalancerIP: 10.0.128.5
  selector:
    app: ms365-mcp
  ports:
    - name: http
      port: 3000
      targetPort: http
