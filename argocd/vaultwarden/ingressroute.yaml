## No auth middleware — Vaultwarden handles its own auth via native SSO + master password.
## Public, and on the mesh: mesh devices resolve these names to the private
## Traefik (see argocd/traefik-internal/README.md); everyone else reaches the
## public route below.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vaultwarden-public
  namespace: vaultwarden
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`warden.mia.cx`) || Host(`vaultwarden.yggdrasil.mia.cx`)
      kind: Rule
      services:
        - name: vaultwarden
          port: 80
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vaultwarden
  namespace: vaultwarden
  annotations:
    kubernetes.io/ingress.class: traefik-internal
spec:
  entryPoints: [vaultwarden]
  routes:
    - match: Host(`warden.mia.cx`) || Host(`vaultwarden.yggdrasil.mia.cx`)
      kind: Rule
      services:
        - name: vaultwarden
          port: 80
  tls:
    secretName: vaultwarden-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vaultwarden-tls
  namespace: vaultwarden
spec:
  secretName: vaultwarden-tls
  dnsNames: [warden.mia.cx, vaultwarden.yggdrasil.mia.cx]
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
