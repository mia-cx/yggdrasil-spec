apiVersion: v1
kind: Namespace
metadata:
  name: vaultwarden
---
# Longhorn PVC for app data (SQLite, configs, icons)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-data-pvc
  namespace: vaultwarden
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 50Gi
---
# NFS PV for attachments
apiVersion: v1
kind: PersistentVolume
metadata:
  name: vaultwarden-attachments-nfs
spec:
  capacity:
    storage: 100Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 10.0.1.2
    path: /mnt/nvme/vaultwarden/attachments
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-attachments-pvc
  namespace: vaultwarden
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 100Gi
  volumeName: vaultwarden-attachments-nfs
  storageClassName: ""
