# The class annotation is the isolation contract: the public Traefik ignores
# this route, the private Traefik picks it up on its `canary` entrypoint.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: canary
  namespace: canary
  annotations:
    kubernetes.io/ingress.class: traefik-internal
spec:
  entryPoints:
    - canary
  routes:
    - match: Host(`canary.mia.cx`)
      kind: Rule
      services:
        - name: whoami
          port: 80
  tls:
    secretName: canary-tls
